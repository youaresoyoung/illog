name: Tag Release & Deploy

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    uses: ./.github/workflows/reusable-validate.yml
    with:
      extract-version: true
    secrets:
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}

  build-sign-notarize:
    name: Build, Sign & Notarize
    runs-on: macos-latest
    needs: validate
    env:
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Apple Code Signing (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_password' }}
        run: |
          set -e
          echo "Setting up Apple code signing..."

          # Create temporary keychain
          KEYCHAIN_NAME="build-$(uuidgen).keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Download and install Apple intermediate certificates (required for complete certificate chain)
          echo "Installing Apple intermediate certificates..."
          curl -sL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          curl -sL "https://www.apple.com/certificateauthority/DeveloperIDCA.cer" -o "$RUNNER_TEMP/DeveloperIDCA.cer"
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$RUNNER_TEMP/DeveloperIDCA.cer"

          # Import certificate
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null

          rm -f "$CERTIFICATE_PATH"

          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          # Verify certificate was imported and show its type
          echo ""
          echo "=== Imported certificates ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          IDENTITY_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "Developer ID Application" || true)
          if [ "$IDENTITY_COUNT" -eq 0 ]; then
            echo ""
            echo "WARNING: No 'Developer ID Application' certificate found in keychain!"
            echo "Available signing identities:"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            echo ""
            echo "The certificate in CERTIFICATE_P12_BASE64 may not be a 'Developer ID Application' type."
            echo "Please verify in Apple Developer portal: https://developer.apple.com/account/resources/certificates/list"
            exit 1
          fi
          echo "OK: Found Developer ID Application certificate"

      - name: Build packages
        run: pnpm nx run-many -t build --projects='packages/*'

      - name: Create production env file
        working-directory: services/app
        run: |
          printf '%s\n' \
            "DB_FILE_NAME=illog.db" \
            "DB_FILE_PATH=./illog.db" \
            "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" \
            "SENTRY_DEV_DSN=${{ secrets.SENTRY_DEV_DSN }}" \
            "CLOUDFRONT_DOMAIN=${{ secrets.AWS_CLOUDFRONT_DOMAIN }}" \
            "UMAMI_HOST=${{ secrets.UMAMI_HOST }}" \
            "UMAMI_WEBSITE_ID=${{ secrets.UMAMI_WEBSITE_ID }}" \
            > .env.production

      - name: Build and Publish arm64 to S3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-2'
        working-directory: services/app
        run: |
          echo "Building, signing, notarizing and publishing arm64 to S3..."
          pnpm exec electron-forge publish --platform=darwin --arch=arm64
          echo "arm64 build completed"

      - name: Preserve arm64 artifacts
        working-directory: services/app
        run: |
          mkdir -p out/make-backup
          cp -r out/make/* out/make-backup/

      - name: Build and Publish x64 to S3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-2'
        working-directory: services/app
        run: |
          echo "Building, signing, notarizing and publishing x64 to S3..."
          pnpm exec electron-forge publish --platform=darwin --arch=x64
          echo "x64 build completed"

      - name: Restore arm64 artifacts
        working-directory: services/app
        run: cp -r out/make-backup/* out/make/

      - name: Verify code signing and notarization
        working-directory: services/app
        run: |
          echo "=== Verifying code signing and notarization ==="

          # Find the .app bundle
          APP_PATH=$(find out -name "*.app" -maxdepth 5 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            exit 1
          fi
          echo "Found app: $APP_PATH"

          # Verify code signature
          echo ""
          echo "--- Code Signature Verification ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          # Full signing identity info (need -dvvv for Authority chain)
          echo ""
          echo "--- Full Signing Details ---"
          codesign -dvvv "$APP_PATH" 2>&1

          # Verify it's signed with Developer ID (not just Apple Development)
          echo ""
          echo "--- Developer ID Check ---"
          SIGN_INFO=$(codesign -dvvv "$APP_PATH" 2>&1)
          AUTHORITY=$(echo "$SIGN_INFO" | grep "Authority=Developer ID Application" || true)
          if [ -z "$AUTHORITY" ]; then
            echo "ERROR: App is NOT signed with 'Developer ID Application' certificate!"
            echo "Gatekeeper will reject this app."
            echo ""
            echo "Actual signing authorities found:"
            echo "$SIGN_INFO" | grep "Authority=" || echo "(none)"
            echo ""
            echo "Full codesign output:"
            echo "$SIGN_INFO"
            exit 1
          fi
          echo "OK: $AUTHORITY"

          # Verify notarization (spctl assessment)
          echo ""
          echo "--- Gatekeeper Assessment ---"
          spctl --assess --type execute --verbose=2 "$APP_PATH" 2>&1 || {
            echo "WARNING: spctl assessment failed - app may not be notarized"
            echo "Checking stapled notarization ticket..."
            xcrun stapler validate "$APP_PATH" 2>&1 || {
              echo "ERROR: No notarization ticket stapled to app!"
              exit 1
            }
          }

          echo ""
          echo "=== All signing and notarization checks passed ==="

      - name: Verify S3 upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-2'
        run: |
          echo "Verifying S3 upload..."
          aws s3 ls s3://illog/updates/darwin/ --recursive --region us-east-2

      - name: Cleanup Keychain (macOS)
        if: always() && runner.os == 'macOS' && env.KEYCHAIN_PATH != ''
        run: |
          echo "Cleaning up keychain..."
          security lock-keychain "$KEYCHAIN_PATH" || true
          security list-keychains -d user -s $(security list-keychains -d user | sed s/\"//g | grep -v "$KEYCHAIN_NAME") || true
          security delete-keychain "$KEYCHAIN_PATH" || true
          echo "Cleanup completed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macOS-${{ needs.validate.outputs.version }}
          path: |
            services/app/out/make/**/*.dmg
            services/app/out/make/**/*.zip
          retention-days: 30

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-sign-notarize]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display artifact structure
        run: ls -R ./artifacts

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          if grep -q "## \[$VERSION\]" CHANGELOG.md 2>/dev/null; then
            CHANGELOG=$(awk "/## \[$VERSION\]/,/^## \[/" CHANGELOG.md | sed '$ d')
          else
            CHANGELOG="Release $VERSION"
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.validate.outputs.version }}
          tag_name: ${{ needs.validate.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Installation

            ### macOS
            - Download the `.dmg` file
            - Open it and drag illog to Applications folder
            - Auto-updates are enabled

            ### Known Issues
            Please check the [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for known issues.

            ## Links
            - [Documentation](https://github.com/${{ github.repository }})
            - [Report Issues](https://github.com/${{ github.repository }}/issues)
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          draft: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate, build-sign-notarize, create-github-release]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Release Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- Version: **${{ needs.validate.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Prerelease: **${{ needs.validate.outputs.is_prerelease }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate.result == 'success' && 'Pass' || 'Fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Sign & Notarize: ${{ needs.build-sign-notarize.result == 'success' && 'Pass' || 'Fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release: ${{ needs.create-github-release.result == 'success' && 'Pass' || (needs.create-github-release.result == 'skipped' && 'Skipped' || 'Fail') }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Binaries uploaded to S3" >> $GITHUB_STEP_SUMMARY
          echo "- Available via CloudFront CDN" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-update manifest updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CDN URLs" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (arm64): \`https://${{ secrets.AWS_CLOUDFRONT_DOMAIN }}/updates/darwin/arm64/\`" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (x64): \`https://${{ secrets.AWS_CLOUDFRONT_DOMAIN }}/updates/darwin/x64/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.create-github-release.result }}" == "success" ]]; then
            echo "### GitHub Release Created" >> $GITHUB_STEP_SUMMARY
            echo "Visit: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
