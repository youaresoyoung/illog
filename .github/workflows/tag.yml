name: Tag Release & Deploy

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    env:
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if it's a prerelease (contains alpha, beta, rc, etc.)
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "Version: $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Build packages
        run: pnpm build:packages

      - name: Type check
        run: pnpm typecheck

      - name: Build renderer
        run: pnpm build:renderer

  build-sign-notarize:
    name: Build, Sign & Notarize (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      matrix:
        os: [macos-latest]
      fail-fast: false
    env:
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Apple Code Signing (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_password' }}
        run: |
          set -e
          echo "Setting up Apple code signing..."

          # Create temporary keychain
          KEYCHAIN_NAME="build-$(uuidgen).keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -x

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null

          rm -f "$CERTIFICATE_PATH"

          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          echo "Certificate imported successfully"

      - name: Build packages
        run: pnpm build:packages

      - name: Build and Publish to S3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-2'
        working-directory: services/app
        run: |
          echo "Building, signing, notarizing and publishing to S3..."

          # Build for arm64
          echo "Building for arm64..."
          pnpm exec electron-forge publish --arch=arm64

          # Build for x64
          echo "Building for x64..."
          pnpm exec electron-forge publish --arch=x64

          echo "Successfully published to S3"

      - name: Verify S3 upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-2'
        run: |
          echo "Verifying S3 upload..."
          aws s3 ls s3://illog/updates/darwin/ --recursive --region us-east-2

      - name: Cleanup Keychain (macOS)
        if: always() && runner.os == 'macOS' && env.KEYCHAIN_PATH != ''
        run: |
          echo "Cleaning up keychain..."
          security lock-keychain "$KEYCHAIN_PATH" || true
          security list-keychains -d user -s $(security list-keychains -d user | sed s/\"//g | grep -v "$KEYCHAIN_NAME") || true
          security delete-keychain "$KEYCHAIN_PATH" || true
          echo "Cleanup completed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ needs.validate.outputs.version }}
          path: |
            services/app/out/make/**/*.dmg
            services/app/out/make/**/*.zip
          retention-days: 30

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-sign-notarize]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display artifact structure
        run: ls -R ./artifacts

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          if grep -q "## \[$VERSION\]" CHANGELOG.md 2>/dev/null; then
            CHANGELOG=$(awk "/## \[$VERSION\]/,/^## \[/" CHANGELOG.md | sed '$ d')
          else
            CHANGELOG="Release $VERSION"
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.validate.outputs.version }}
          tag_name: ${{ needs.validate.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Installation

            ### macOS
            - Download the `.dmg` file
            - Open it and drag illog to Applications folder
            - Auto-updates are enabled

            ### Known Issues
            Please check the [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for known issues.

            ## Links
            - [Documentation](https://github.com/${{ github.repository }})
            - [Report Issues](https://github.com/${{ github.repository }}/issues)
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          draft: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate, build-sign-notarize, create-github-release]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Release Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- Version: **${{ needs.validate.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Prerelease: **${{ needs.validate.outputs.is_prerelease }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate.result == 'success' && 'Pass' || 'Fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Sign & Notarize: ${{ needs.build-sign-notarize.result == 'success' && 'Pass' || 'Fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release: ${{ needs.create-github-release.result == 'success' && 'Pass' || (needs.create-github-release.result == 'skipped' && 'Skipped' || 'Fail') }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Binaries uploaded to S3" >> $GITHUB_STEP_SUMMARY
          echo "- Available via CloudFront CDN" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-update manifest updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CDN URLs" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (arm64): \`https://${{ secrets.AWS_CLOUDFRONT_DOMAIN }}/updates/darwin/arm64/\`" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (x64): \`https://${{ secrets.AWS_CLOUDFRONT_DOMAIN }}/updates/darwin/x64/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.create-github-release.result }}" == "success" ]]; then
            echo "### GitHub Release Created" >> $GITHUB_STEP_SUMMARY
            echo "Visit: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
