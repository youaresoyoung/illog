name: Main Branch Checks & Create Final Artifacts

on:
  push:
    branches:
      - main

concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    env:
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if it's a prerelease (contains alpha, beta, rc, etc.)
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "Version: $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm nx run-many -t lint --parallel=3

      - name: Build packages
        run: pnpm nx run-many -t build --projects='packages/*'

      - name: Type check
        run: pnpm nx run-many -t typecheck --parallel=3

      - name: Build renderer
        run: pnpm nx run illog-app:build

  build-sign-notarize:
    name: Build, Sign & Notarize
    runs-on: macos-latest
    needs: validate
    env:
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Apple Code Signing (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          echo "Setting up Apple code signing..."

          # Create temporary keychain
          KEYCHAIN_NAME="build-$(uuidgen).keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -x

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null

          rm -f "$CERTIFICATE_PATH"

          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          echo "Certificate imported successfully"

      - name: Build packages
        run: pnpm nx run-many -t build --projects='packages/*'

      - name: Create production env file
        working-directory: services/app
        run: |
          printf '%s\n' \
            "DB_FILE_NAME=illog.db" \
            "DB_FILE_PATH=./illog.db" \
            "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" \
            "CLOUDFRONT_DOMAIN=${{ secrets.AWS_CLOUDFRONT_DOMAIN }}" \
            > .env.production

      - name: Build and Package (arm64)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: services/app
        run: |
          echo "Building arm64..."
          pnpm make --arch=arm64

      - name: Preserve arm64 artifacts
        working-directory: services/app
        run: |
          mkdir -p out/make-arm64
          cp -r out/make/* out/make-arm64/

      - name: Build and Package (x64)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: services/app
        run: |
          echo "Building x64..."
          pnpm make --arch=x64

      - name: Restore arm64 artifacts
        working-directory: services/app
        run: cp -r out/make-arm64/* out/make/

      - name: Cleanup Keychain (macOS)
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          echo "Cleaning up keychain..."
          security lock-keychain "$KEYCHAIN_PATH" || true
          security list-keychains -d user -s $(security list-keychains -d user | sed s/\"//g | grep -v "$KEYCHAIN_NAME") || true
          security delete-keychain "$KEYCHAIN_PATH" || true
          echo "Cleanup completed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macOS-${{ needs.validate.outputs.version }}
          path: |
            services/app/out/make/**/*.dmg
            services/app/out/make/**/*.zip
          retention-days: 30

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate, build-sign-notarize]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Release Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- Version: **${{ needs.validate.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Prerelease: **${{ needs.validate.outputs.is_prerelease }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate.result == 'success' && 'Pass' || 'Fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Sign & Notarize: ${{ needs.build-sign-notarize.result == 'success' && 'Pass' || 'Fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
