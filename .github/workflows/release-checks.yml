name: Release Branch Checks

on:
  push:
    branches:
      - 'release/*'
  pull_request:
    branches:
      - 'release/*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  release-validation:
    name: Release Validation
    runs-on: ubuntu-latest
    env:
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Build packages
        run: pnpm build:packages

      - name: Type check
        run: pnpm typecheck

      - name: Build renderer
        run: pnpm build:renderer

  build-and-sign:
    name: Build & Sign (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release-validation
    strategy:
      matrix:
        os: [macos-latest]
      fail-fast: false
    env:
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Apple Code Signing
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_password' }}
        run: |
          set -e
          echo "Setting up Apple code signing..."

          # Create temporary keychain
          KEYCHAIN_NAME="build-$(uuidgen).keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -x

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null

          rm -f "$CERTIFICATE_PATH"

          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          echo "Certificate imported successfully"

      - name: Build packages
        run: pnpm build:packages

      - name: Create production env file
        working-directory: services/app
        run: |
          printf '%s\n' \
            "DB_FILE_NAME=illog.db" \
            "DB_FILE_PATH=./illog.db" \
            "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" \
            "CLOUDFRONT_DOMAIN=${{ secrets.AWS_CLOUDFRONT_DOMAIN }}" \
            > .env.production

      - name: Build and Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: services/app
        run: |
          echo "Building and packaging..."
          pnpm package

      - name: Cleanup Keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          echo "Cleaning up keychain..."
          security lock-keychain "$KEYCHAIN_PATH" || true
          security list-keychains -d user -s $(security list-keychains -d user | sed s/\"//g | grep -v "$KEYCHAIN_NAME") || true
          security delete-keychain "$KEYCHAIN_PATH" || true
          echo "Cleanup completed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.sha }}
          path: services/app/out/
          retention-days: 14

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release-validation, build-and-sign]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Generate summary
        run: |
          echo "## Release Branch Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.release-validation.result == 'success' && 'Pass' || 'Fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Sign: ${{ needs.build-and-sign.result == 'success' && 'Pass' || 'Fail' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Signed macOS build available" >> $GITHUB_STEP_SUMMARY
          echo "- Notarization will be done on main branch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Test the release build thoroughly" >> $GITHUB_STEP_SUMMARY
          echo "- Merge to main when ready for production" >> $GITHUB_STEP_SUMMARY
