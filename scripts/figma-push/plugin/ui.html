<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>illog Tokens Sync</title>
    <style>
      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 12px;
        margin: 0;
        padding: 16px;
        color: #1e1e1e;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: #555;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      input[type='file'] {
        flex: 1;
      }
      button {
        background: #18a0fb;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      pre#log {
        background: #f5f5f5;
        border-radius: 4px;
        padding: 8px;
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        font-size: 11px;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>illog Tokens Sync</h1>
    <p>Pick the <code>tokens.dtcg.json</code> exported from this repo. The plugin upserts a Figma Variables collection named <strong>illog</strong>.</p>

    <div class="row">
      <input type="file" id="file" accept="application/json,.json" />
      <button id="run" disabled>Sync</button>
    </div>

    <pre id="log">Ready.</pre>

    <script>
      const fileInput = document.getElementById('file')
      const runBtn = document.getElementById('run')
      const log = document.getElementById('log')

      let payload = null

      fileInput.addEventListener('change', async () => {
        const file = fileInput.files && fileInput.files[0]
        if (!file) return
        try {
          const text = await file.text()
          payload = JSON.parse(text)
          runBtn.disabled = false
          log.textContent = `Loaded ${file.name} (${(file.size / 1024).toFixed(1)} KB).`
        } catch (err) {
          payload = null
          runBtn.disabled = true
          log.textContent = `Failed to parse JSON: ${err.message}`
        }
      })

      runBtn.addEventListener('click', () => {
        if (!payload) return
        runBtn.disabled = true
        log.textContent = 'Syncing…'
        parent.postMessage({ pluginMessage: { type: 'sync', payload } }, '*')
      })

      window.onmessage = event => {
        const msg = event.data && event.data.pluginMessage
        if (!msg) return
        if (msg.type === 'log') log.textContent = msg.text
        if (msg.type === 'done') runBtn.disabled = false
      }
    </script>
  </body>
</html>
